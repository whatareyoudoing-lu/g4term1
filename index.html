<script>const z=(han,py)=>({han,py});

[['听到','tīng dào','to hear'],['雷声','léi shēng','thunder'],['声音','shēng yīn','sound; voice'],['大','dà','loud; big'],['睡','shuì','to sleep'],['昨晚','zuó wǎn','last night'],['睡不着','shuì bu zháo','unable to fall asleep']]

[z('A · 我不确定怎么回答这个问题。','wǒ bù què dìng zěn me huí dá zhè ge wèn tí'),z('B · 这很容易。','zhè hěn róng yì'),z('B · 我来告诉你怎么解决它。','wǒ lái gào su nǐ zěn me jiě jué tā')],

['被锁住的书房','The Locked Study','The door clicks shut. A loose page sticks out from the bookshelf.','大门突然锁上了。书架里露出一张纸。'],
['神秘的晚餐','The Missing Dinner','The lamp is on, but dinner is missing. A folded menu sits by the kitchen.','灯亮着，晚餐却不见了。厨房旁有一张菜单。'],
['昨夜的雷声','The Thunder Mystery','Rain runs down the window. A diary lies beside the bed.','雨水滑过窗户。床边放着一本日记。'],

key:['🔑','黄铜钥匙','Brass key'],apple:['🍎','苹果','Apple'],milk:['🥛','牛奶','Milk'],chicken:['🍗','炸鸡','Fried chicken'],plate:['🍽️','餐具','Place setting'],record:['📜','天气记录','Weather record']

[
['书架','Bookshelf',15,38,[match(0,0,5),match(0,5,9,true)],'Scan the word tags on the shelf.','Notice 回答 and 解决.','Answer a question, solve a problem.'],
['书桌','Writing desk',49,58,[order('Put the conversation in order. Read each speaker’s line.',dialogue[0]),q(dialogue[0][2],['B offers to show how to solve the problem.','A asks where the problem is.','B says nobody can solve it.'])],'Read the scraps on the desk.','Look for 我来 in the last line.','The speaker volunteers to help.','key'],
['抽屉','Locked drawer',49,81,[use('key','Drag an item here, or select it and tap here.'),order('Rebuild the first line from the desk.',[z('我','wǒ'),z('不确定','bù què dìng'),z('怎么','zěn me'),z('回答','huí dá'),z('这个问题。','zhè ge wèn tí')]),q(dialogue[0][0],['A is unsure how to answer this question.','A is asking what the question is.','A already knows how to answer.'])],'Check the desk for an item that fits.','Read 不确定 and 怎么 together.','Here 怎么 is part of a statement about how to do something.'],
['镶嵌柜','Inlaid cabinet',85,59,[q(z('这很容易。','zhè hěn róng yì'),['This is quite easy.','This is too hard.','That was interesting.']),order('Repair the cabinet label using the same pattern.',[z('今天的课','jīn tiān de kè'),z('很','hěn'),z('容易。','róng yì')])],'The label uses the same pattern as B’s short line.','Look at 很 before 容易.','Put the thing you describe first, then 很 and an adjective.']
],
[
['菜单','Menu',25,41,[match(1,0,2,true),match(1,2,5),order('Restore the menu’s conversation.',dialogue[1])],'Unfold the menu by the kitchen.','晚餐 is the meal. 摆 is the action.','A asks about the meal and then volunteers after B answers.','plate'],
['厨房','Kitchen pass',52,38,[order('Rebuild the question on the order slip.',[z('我们','wǒ men'),z('晚餐','wǎn cān'),z('吃','chī'),z('什么？','shén me')]),q(dialogue[1][0],['What are we having for dinner?','When will we have dinner?','Who is having dinner?']),q(dialogue[1][1],['We → eat → fried chicken','I → set → the table','They → cook → dinner'])],'Check the question on the menu.','Look for 什么 after 吃.','Find who does the action, the action, then the thing.'],
['冰箱','Fridge',83,53,[q('Read both menu lines. Choose the food for tonight.',[z('炸鸡','zhá jī'),z('苹果','píng guǒ'),z('牛奶','niú nǎi')])],'Check the menu on the clue board.','Read B’s line. Find the word after 吃.','B names the dinner food in the second line.','chicken'],
['餐桌','Dining table',46,78,[q(dialogue[1][2],['A is happy and offers to set the table.','B is happy and asks A to cook.','A says the table is already set.']),use('plate','Set the table. Drag or tap-select an item.'),use('chicken','Serve the dinner from the menu.'),q(z('妈妈做的炸鸡太___了！','mā ma zuò de zhá jī tài ___ le!'),[z('好吃','hǎo chī'),z('快','kuài'),z('锋利','fēng lì')])],'Use what you collected from the menu and fridge.','Check 摆桌子 and the food B mentions.','太 and 了 surround the adjective that describes how the food tastes.']
],
[
['日记','Diary',23,70,[match(2,0,4,true),match(2,4,7)],'Read the diary by the bed.','Notice the difference between 声音 and 雷声.','声音 can be any sound. 雷声 is a particular sound in a storm.'],
['雨窗','Rain window',50,32,[q('Find the weather record that matches the question in the diary.',[z('昨晚：雷声','zuó wǎn: léi shēng'),z('昨晚：小鸟的叫声','zuó wǎn: xiǎo niǎo de jiào shēng'),z('今天：雷声','jīn tiān: léi shēng')])],'Read A’s question in the diary.','Find both 昨晚 and 雷声.','Match the time and the sound on the same record.','record'],
['时钟','Clock',82,26,[use('record','Insert the weather record.'),order('Restore the practice line about a sound someone did not hear.',[z('我','wǒ'),z('没','méi'),z('听','tīng'),z('到','dào'),z('她的声音。','tā de shēng yīn')]),q(dialogue[2][1],[z('听到了','tīng dào le'),z('没听到','méi tīng dào'),z('睡着了','shuì zháo le')])],'Read the weather record, then check B’s answer in the diary.','没 goes before 听到 when the result did not happen.','B says 是的 to a question about hearing thunder.'],
['录音机','Recorder',80,71,[order('Restore the written recording. No sound is needed.',dialogue[2]),q(dialogue[2][2],['A and B both could not fall asleep.','Only A could not fall asleep.','Both of them fell asleep.']),q('Which pair means “can hear / cannot hear”?', [z('听得到／听不到','tīng de dào / tīng bu dào'),z('听到了／没听到','tīng dào le / méi tīng dào'),z('看得清／看不清','kàn de qīng / kàn bu qīng')])],'Read the transcript in the recorder.','Look for 也, then compare 得 and 不.','也 tells you A had the same experience. 得 and 不 between the verb and complement express possibility.'],
['床头','Bedside panel',25,46,[order('Rebuild A’s line about not being able to fall asleep.',[z('我','wǒ'),z('也','yě'),z('睡','shuì'),z('不','bu'),z('着。','zháo')]),{kind:'match',reverse:false,prompt:'Match each note to the result that fits its situation.',pairs:[[z('这本书很简单，我看得___。','zhè běn shū hěn jiǎn dān, wǒ kàn de ___'),z('懂','dǒng')],[z('今天的水果太多了，我吃不___。','jīn tiān de shuǐ guǒ tài duō le, wǒ chī bu ___'),z('完','wán')],[z('这个桌子太重了，我搬不___。','zhè ge zhuō zi tài zhòng le, wǒ bān bu ___'),z('动','dòng')],[z('我没学过法语，我说不___。','wǒ méi xué guo fǎ yǔ, wǒ shuō bu ___'),z('好','hǎo')],[z('那个电影很受欢迎，你买得___它的票吗？','nà ge diàn yǐng hěn shòu huān yíng, nǐ mǎi de ___ tā de piào ma'),z('到','dào')],[z('你只有五分钟，来得___吗？','nǐ zhǐ yǒu wǔ fēn zhōng, lái de ___ ma'),z('及','jí')]]}],'Check the last line on the recorder, then the six notes.','For each note, read the situation before the comma.','Think about understanding, finishing, moving, doing well, getting something, or making it in time.']
]

function paint(canvas, room){
  const c=canvas.getContext('2d'), W=1000,H=580;
  function box(x,y,w,h,color,edge='#281e24',r=4){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=color;c.fill();if(edge){c.strokeStyle=edge;c.lineWidth=3;c.stroke();}}
  function poly(points,color,edge='#281e24'){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=color;c.fill();if(edge){c.strokeStyle=edge;c.lineWidth=3;c.stroke();}}
  function ellipse(x,y,rx,ry,color){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fillStyle=color;c.fill();}
  function line(x,y,a,b,color,width=2){c.beginPath();c.moveTo(x,y);c.lineTo(a,b);c.strokeStyle=color;c.lineWidth=width;c.stroke();}
  function glow(x,y,r){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#ffc87865');g.addColorStop(1,'#ffc87800');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
  function lamp(x,y){glow(x,y,170);line(x,y+20,x,y+95,'#d5a968',6);ellipse(x,y+95,26,6,'#c08f56');poly([[x-22,y],[x+22,y],[x+40,y+42],[x-40,y+42]],'#ffd58b');line(x-35,y+36,x+35,y+36,'#fff0b6',3);}
  function windowAt(x,y,w,h){box(x-8,y-7,w+16,h+16,'#74503d');box(x,y,w,h,'#163345');ellipse(x+w*.69,y+h*.25,19,19,'#e5d9a8');poly([[x,y+h],[x,y+h*.72],[x+w*.27,y+h*.51],[x+w*.48,y+h*.72],[x+w*.77,y+h*.55],[x+w,y+h*.68],[x+w,y+h]],'#234a53',null);for(let i=0;i<32;i++){let a=(i*37)%(w-12),b=(i*53)%(h-20);line(x+a+10,y+b,x+a+3,y+b+16,'#aacbd58a');}line(x+w/2,y,x+w/2,y+h,'#93634c',8);line(x,y+h/2,x+w,y+h/2,'#93634c',8);box(x-16,y+h,w+32,12,'#946349');}
  function cabinet(x,y,w,h){box(x,y,w,h,'#653d36');box(x-9,y-10,w+18,15,'#aa7353');box(x+10,y+11,w-20,h-25,'#855039');line(x+w/2,y+12,x+w/2,y+h-15,'#3c2930',3);ellipse(x+w/2-13,y+h/2,4,4,'#f5c27a');ellipse(x+w/2+13,y+h/2,4,4,'#f5c27a');}

function evidence(r,i){
 if(r===0&&i===1)return dialogue[0].map(note).join('');
 if(r===0&&i===2)return note(dialogue[0][0]);
 if(r===0&&i===3)return note(z('今天的课很容易。','jīn tiān de kè hěn róng yì'));
 if(r===1&&i===0)return dialogue[1].map(note).join('');
 if(r===1&&i===2)return note(z('炸鸡','zhá jī'));
 if(r===1&&i===3)return note(z('妈妈做的炸鸡太好吃了！','mā ma zuò de zhá jī tài hǎo chī le'));
 if(r===2&&i===0)return dialogue[2].slice(0,2).map(note).join('');
 if(r===2&&i===1)return note(z('昨晚：雷声','zuó wǎn: léi shēng'));
 if(r===2&&i===2)return note(z('我没听到她的声音。','wǒ méi tīng dào tā de shēng yīn'));
 if(r===2&&i===3)return dialogue[2].map(note).join('');
 if(r===2&&i===4)return note(dialogue[2][2]);
 return '';
}
function receive(step){
 state.steps[key()]=(state.steps[key()]||0)+1;
 draft=[];pending=null;
 setFeedback('正确！ · That fits. Keep going.',true);
 const t=tasks[state.room][active];
 if(state.steps[key()]===t[4].length){
  state.done[key()]=100-25*(state.hints[key()]||0);
  if(t[8]&&!state.bag.includes(t[8]))state.bag.push(t[8]);
  save();render();
  const loot=t[8]?'<p>'+items[t[8]][0]+' '+items[t[8]][1]+' · '+items[t[8]][2]+' → Inventory</p>':'';
  show(t[0]+' · '+t[1],'<p class="good">机关已解开 · Puzzle solved · +'+state.done[key()]+' pts</p>'+loot+evidence(state.room,active)+btn('继续调查 · Continue exploring','close','','class="primary"'));
  return;
 }
 save();puzzle();
}
function tryItem(item){
 if(!Number.isInteger(active)||active!==current())return;
 const step=tasks[state.room][active][4][state.steps[key()]||0];
 if(step?.kind!=='use')return;
 if(!state.bag.includes(item)){setFeedback('先选择物品。 · Select an item from your bag first.');puzzle();return;}
 if(item!==step.item){setFeedback('再读一次线索。 · This item does not fit. Read the clue and try another item.');puzzle();return;}
 state.bag=state.bag.filter(x=>x!==item);selection='';receive(step);
}
function board(){
 const entries=[];
 for(let r=0;r<Math.min(state.room+1,3);r++){
  for(let i=0;i<tasks[r].length;i++){
   const k=id(r,i);
   if(state.done[k]||state.seen[k]){
    const t=tasks[r][i], text=evidence(r,i);
    entries.push('<article><b>'+t[0]+' · '+t[1]+'</b><p class="'+(state.done[k]?'good':'muted')+'">'+(state.done[k]?'已解开 · Solved':'待解决 · Open puzzle')+'</p>'+text+'</article>');
   }
  }
 }
 const next=current(), t=tasks[state.room]?.[next];
 const cardsHtml=cards.slice(0,state.room+(current()===-1?1:0)).map(card=>'<article><h3>'+card.title+'</h3>'+note(card.quote)+'<p>'+card.prompt+'</p><div class="card-map">'+card.options.map(([n,x])=>'<span><b class="badge">'+n+'</b>'+rich(x)+'</span>').join('')+'</div></article>').join('');
 show('线索板 · Clue Board','<div class="notes">'+cardsHtml+(t?'<article><b>待解决 · Next puzzle</b><p>'+t[0]+' · '+t[1]+'</p></article>':'')+entries.join('')+'</div>',active==='lock'||Number.isInteger(active)&&!state.done[key()]);
}
const lockHints=['Open the clue board and read the three evidence cards.','Read the lines about how B helps, what they eat, and when they hear thunder.','Find the number next to the matching Chinese phrase on each card. Use study, dinner, then thunder.'];
function lock(){
 active='lock';
 show('大门密码锁 · Door lock',btn('查看线索板 · Open Clue Board','board')+'<p class="caption">1. Study → 2. Dinner → 3. Thunder</p><form id="lockform" class="row"><label for="digits">三位密码 · 3-digit code</label><input class="pin" id="digits" inputmode="numeric" autocomplete="off" maxlength="3" pattern="[0-9]{3}" required><button class="primary" type="submit">开门 · Unlock</button></form><p class="feedback" role="status">'+esc(feedback)+'</p>'+hintContent('door',lockHints));
}
function clearModal(){
 if(overlay.open)overlay.close();
 active=null;draft=[];pending=null;setFeedback('');
}
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');
 if(!button||button.disabled)return;
 const action=button.dataset.action, raw=button.dataset.value, n=Number(raw);
 const isTask=Number.isInteger(active)&&!state.done[key()]&&active===current();
 const step=isTask?tasks[state.room][active][4][state.steps[key()]||0]:null;
 switch(action){
 case 'pinyin':state.pinyin=!state.pinyin;save();document.body.classList.toggle('no-pinyin',!state.pinyin);document.querySelectorAll('[data-action=pinyin]').forEach(el=>el.textContent=state.pinyin?'隐藏拼音 · Hide Pinyin':'显示拼音 · Show Pinyin');break;
 case 'resume':home=false;render();break;
 case 'home':clearModal();home=true;render();break;
 case 'board':board();break;
 case 'meaning':
  if(!overlay.open&&state.room===3)active='lock';
  openMeaning();break;
 case 'reveal-meaning':{
  const entry=currentMeaning();
  if(entry&&!state.meanings[entry.id]){
   state.meanings[entry.id]=true;
   save();render();
  }
  openMeaning();break;
 }
 case 'back':if(active==='lock')lock();else puzzle();break;
 case 'close':clearModal();break;
 case 'spot':
  active=n;draft=[];pending=null;setFeedback('');
  if(!state.done[key()]&&n===current()){state.seen[key()]=true;save();}
  puzzle();break;
 case 'item':
  selection=selection===raw?'':raw;
  document.querySelectorAll('[data-item]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.item===selection)));
  break;
 case 'place':tryItem(selection);break;
 case 'pick':
  if(step?.kind!=='pick')break;
  if(n===0)receive(step);else{setFeedback('再读一次。 · Look again at who did what, and when.');puzzle();}break;
 case 'tile':draft.push(n);setFeedback('');puzzle();break;
 case 'untile':draft.splice(n);setFeedback('');puzzle();break;
 case 'left':pending=n;puzzle();break;
 case 'right':
  if(pending===null){setFeedback('先点左边的卡片。 · Choose a card on the left first.');puzzle();break;}
  if(draft.includes(n))draft[draft.indexOf(n)]=null;
  draft[pending]=n;pending=null;setFeedback('');puzzle();break;
 case 'check':{
  const count=step.kind==='order'?step.choices.length:step.pairs.length;
  if(Array.from({length:count},(_,j)=>draft[j]===j).every(Boolean))receive(step);
  else{setFeedback(step.kind==='match'?'有些配对还不合适。 · Check the meanings and adjust your pairs.':'顺序还需要调整。 · Tap a tile in your answer to remove it and the tiles after it.');puzzle();}
  break;
 }
 case 'hint':
  state.hints[raw]=Math.min(3,(state.hints[raw]||0)+1);save();
  if(raw==='door')lock();else puzzle();
  break;
 case 'next':
  if(current()!==-1)break;
  show('找到证据 · Evidence found',note(cards[state.room].quote)+'<p>线索已加入线索板。 · Take this evidence to the next room.</p>'+btn('进入下一间 · Enter next room','advance','','class="primary"'));
  break;
 case 'advance':
  if(current()!==-1)break;
  state.room++;clearModal();save();render();window.scrollTo(0,0);break;
 case 'lock':setFeedback('');lock();break;
 }
});
document.addEventListener('submit',event=>{
 event.preventDefault();
 if(event.target.id==='start'){
  const input=document.querySelector('#player'), name=input.value.trim();
  if(!name){input.setCustomValidity('Please enter your name.');input.reportValidity();input.oninput=()=>input.setCustomValidity('');return;}
  const pinyin=state.pinyin;state={...empty(),name,pinyin};home=false;selection='';save();render();window.scrollTo(0,0);
 }else if(event.target.id==='lockform'&&state.room===3){
  const input=document.querySelector('#digits');
  if(input.value===cards.map(x=>x.digit).join('')){
   state.done.door=100-25*(state.hints.door||0);state.won=true;clearModal();save();render();window.scrollTo(0,0);
  }else{setFeedback('门还锁着。 · Compare the three evidence cards and check the order.');modal.querySelector('.feedback').textContent=feedback;input.select();}
 }
});
overlay.addEventListener('cancel',event=>{event.preventDefault();clearModal();});
document.addEventListener('dragstart',event=>{
 const item=event.target.closest('[data-item]');if(item){event.dataTransfer.setData('text/plain',item.dataset.item);event.dataTransfer.effectAllowed='move';}
});
document.addEventListener('dragover',event=>{
 if(event.target.closest('[data-drop]')){event.preventDefault();event.dataTransfer.dropEffect='move';}
});
document.addEventListener('drop',event=>{
 if(event.target.closest('[data-drop]')){event.preventDefault();tryItem(event.dataTransfer.getData('text/plain'));}
});
render();
</script></body></html>
